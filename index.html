<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c0392b" />
<title>ЧУ и ЩУ — игра</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%86%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg1:#ff4757;
    --bg2:#b51a2b;
    --ink:#ffffff;
    --muted:rgba(255,255,255,.78);
    --chu:#ffd43b;   /* ЧУ identity = sunny yellow */
    --shu:#06aed5;   /* ЩУ identity = bright cyan  */
    --ok:#aaf683;
    --bad:#ffd166;
    --piece:#fde6f1;
    --piece2:#e3ddff;
    --piece3:#d9f1ff;
    --piece4:#fff0c2;
    --piece5:#d6f5dc;
    --shadow:0 4px 0 rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    overscroll-behavior:none;user-select:none}
  body{min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(1200px 600px at 20% -10%, #ff7a85 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #7a0e1c 0%, transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
  }

  header{padding:14px 16px 6px;text-align:center}
  .title{font-size:22px;font-weight:800;letter-spacing:.5px;margin:0;
    text-shadow:0 2px 0 rgba(0,0,0,.18)}
  .title .c{color:var(--chu)}
  .title .s{color:var(--shu)}
  .rule{font-size:13px;color:var(--muted);margin:4px 0 0}

  .scoreRow{display:flex;justify-content:space-between;align-items:center;
    padding:8px 16px}
  .score,.progress{font-size:13px;color:var(--muted);font-weight:600}
  .score b{color:#fff;font-size:16px}

  main{flex:1;display:flex;flex-direction:column;justify-content:space-between;
    padding:8px 14px 18px;gap:10px}

  .stage{display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:18px 8px 8px}

  .word{font-size:30px;font-weight:800;letter-spacing:2px;min-height:42px;
    display:flex;align-items:center;justify-content:center;gap:2px;
    color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .word .slot{opacity:.55;border-bottom:3px dashed rgba(255,255,255,.7);padding:0 6px;min-width:48px;text-align:center}
  .word .fill{color:var(--chu);animation:pop .35s ease}
  .word .fill.shu{color:var(--shu)}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

  .hint{font-size:14px;color:var(--muted);min-height:18px;text-align:center;
    transition:color .2s}
  .hint.ok{color:#fffbcf;font-weight:700}
  .hint.bad{color:#ffe5a8;font-weight:700}

  .piece{
    --bgp:var(--piece);
    background:var(--bgp);
    color:#2a2350;
    font-weight:800;
    font-size:30px;
    letter-spacing:1.5px;
    padding:18px 24px;
    border-radius:18px;
    box-shadow:var(--shadow);
    position:relative;
    min-width:120px;
    text-align:center;
  }
  .piece::before,.piece::after{
    content:"";position:absolute;width:22px;height:22px;background:var(--bgp);
    border-radius:50%;top:50%;transform:translateY(-50%);
  }
  .piece::before{left:-11px}
  .piece::after{right:-11px}

  .choices{display:flex;gap:18px;justify-content:center;align-items:center;
    padding:6px 4px 14px;flex-wrap:wrap}
  .btn{
    appearance:none;border:0;cursor:pointer;
    font:inherit;font-weight:900;font-size:34px;letter-spacing:2px;
    padding:18px 28px;border-radius:22px;color:#2a2350;
    box-shadow:var(--shadow);
    transition:transform .08s ease, filter .15s ease;
    min-width:130px;
  }
  .btn:active{transform:translateY(2px) scale(.98)}
  .btn.chu{background:linear-gradient(180deg,#fff09a,#ffc83b);color:#3a2a00}
  .btn.shu{background:linear-gradient(180deg,#7be3ff,#06aed5);color:#04263a}
  .btn.disabled{filter:grayscale(.4) opacity(.55);pointer-events:none}
  .btn.flashOk{animation:flashOk .5s ease}
  .btn.flashBad{animation:shake .4s ease}
  @keyframes flashOk{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .collected{
    background:rgba(255,255,255,.96);color:#2a2350;border-radius:18px;padding:10px 12px;
    box-shadow:0 2px 0 rgba(0,0,0,.1), 0 6px 18px rgba(0,0,0,.18);
    max-height:34vh;overflow-y:auto;
  }
  .collected h3{margin:0 0 8px;font-size:13px;color:#6b6792;text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .collected ul{list-style:none;margin:0;padding:0;display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
  .collected li{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:6px}
  .collected li .k{font-size:11px;color:#6b6792;font-weight:600;min-width:54px}
  .collected li .v.chu{color:#c9931d}
  .collected li .v.shu{color:#0683a0}
  .collected:empty{display:none}

  .toolbar{display:flex;gap:10px;justify-content:center;padding:4px 0 6px}
  .tool{
    appearance:none;border:0;background:rgba(255,255,255,.96);color:#2a2350;
    font:inherit;font-weight:700;font-size:13px;padding:10px 16px;
    border-radius:999px;box-shadow:var(--shadow);cursor:pointer;
  }
  .tool:active{transform:translateY(1px)}
  .tool .ic{margin-right:6px}

  .finish{
    position:fixed;inset:0;background:rgba(40,0,5,.62);
    display:none;align-items:center;justify-content:center;
    padding:20px;z-index:5;
  }
  .finish.show{display:flex}
  .finish #fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .finish .card{
    position:relative;z-index:1;
    background:#fff;color:#2a2350;border-radius:22px;padding:22px;text-align:center;
    max-width:340px;width:100%;box-shadow:var(--shadow);
  }
  .finish h2{margin:0 0 6px;font-size:22px}
  .finish p{margin:6px 0 14px;color:#6b6792}
  .finish .big{font-size:46px;margin:8px 0}
  .finish .again{
    background:linear-gradient(180deg,#ffd86b,#ffae3b);
    color:#3a2a00;border:0;font-weight:900;font-size:16px;
    padding:14px 24px;border-radius:14px;box-shadow:var(--shadow);cursor:pointer;
  }

  @media (min-width:520px){
    .word{font-size:38px}
    .piece{font-size:36px;padding:22px 32px}
    .btn{font-size:42px;padding:22px 36px}
  }
</style>
</head>
<body>
  <header>
    <h1 class="title"><span class="c">ЧУ</span> и <span class="s">ЩУ</span> — собери слова</h1>
    <p class="rule">ЧУ и ЩУ всегда пишутся с буквой У. Соедини половинки!</p>
  </header>

  <div class="scoreRow">
    <div class="score">Очки: <b id="score">0</b></div>
    <div class="progress" id="progress">1 / 16</div>
  </div>

  <main>
    <section class="stage">
      <div class="word" id="word" aria-live="polite"></div>
      <div class="piece" id="piece">—</div>
      <div class="hint" id="hint">Какое сочетание подходит?</div>
      <div class="choices">
        <button class="btn chu" id="chuBtn" aria-label="ЧУ">ЧУ</button>
        <button class="btn shu" id="shuBtn" aria-label="ЩУ">ЩУ</button>
      </div>
    </section>

    <div class="toolbar">
      <button class="tool" id="speakBtn" title="Произнести"><span class="ic">🔊</span>Сказать</button>
      <button class="tool" id="resetBtn" title="Заново"><span class="ic">↺</span>Заново</button>
    </div>

    <section class="collected" id="collected" aria-label="Собранные слова">
      <h3>Собранные слова</h3>
      <ul id="collectedList"></ul>
    </section>
  </main>

  <div class="finish" id="finish" role="dialog" aria-modal="true">
    <canvas id="fw" aria-hidden="true"></canvas>
    <div class="card">
      <div class="big" id="finishEmoji">🎆</div>
      <h2 id="finishTitle">Молодец!</h2>
      <p id="finishText">Ты собрал все слова с ЧУ и ЩУ.</p>
      <button class="again" id="againBtn">Сыграть ещё</button>
    </div>
  </div>

<script>
  // New word set. Each item: piece on the puzzle, pair (chu|shu),
  // pos (pre = ЧУ/ЩУ goes BEFORE the piece, post = AFTER).
  const WORDS = [
    {piece:"ДЕСА",  pair:"chu", pos:"pre"},   // ЧУДЕСА
    {piece:"ЛОК",   pair:"chu", pos:"pre"},   // ЧУЛОК
    {piece:"ЖОЙ",   pair:"chu", pos:"pre"},   // ЧУЖОЙ
    {piece:"ТКИЙ",  pair:"chu", pos:"pre"},   // ЧУТКИЙ
    {piece:"ХО",    pair:"chu", pos:"post"},  // ХОЧУ
    {piece:"КРИ",   pair:"chu", pos:"post"},  // КРИЧУ
    {piece:"СКА",   pair:"chu", pos:"post"},  // СКАЧУ
    {piece:"ПЛА",   pair:"chu", pos:"post"},  // ПЛАЧУ
    {piece:"СТУ",   pair:"chu", pos:"post"},  // СТУЧУ
    {piece:"ЛЕ",    pair:"chu", pos:"post"},  // ЛЕЧУ
    {piece:"РИТЬ",  pair:"shu", pos:"pre"},   // ЩУРИТЬ
    {piece:"ПЛЫЙ",  pair:"shu", pos:"pre"},   // ЩУПЛЫЙ
    {piece:"И",     pair:"shu", pos:"post"},  // ИЩУ
    {piece:"ПИ",    pair:"shu", pos:"post"},  // ПИЩУ
    {piece:"ТРЕ",   pair:"shu", pos:"post"},  // ТРЕЩУ
    {piece:"ТА",    pair:"shu", pos:"post"},  // ТАЩУ
    {piece:"ПЛЕ",   pair:"shu", pos:"post"},  // ПЛЕЩУ
    {piece:"ПРО",   pair:"shu", pos:"post"},  // ПРОЩУ
  ];

  const shuffle = a => {
    const x = a.slice();
    for (let i = x.length - 1; i > 0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [x[i], x[j]] = [x[j], x[i]];
    }
    return x;
  };

  const state = {
    order: shuffle(WORDS),
    idx: 0,
    score: 0,
    collected: [],
    locked: false,
  };

  const $ = id => document.getElementById(id);
  const wordEl = $("word"),
        pieceEl = $("piece"),
        hintEl = $("hint"),
        chuBtn = $("chuBtn"),
        shuBtn = $("shuBtn"),
        scoreEl = $("score"),
        progEl = $("progress"),
        listEl = $("collectedList"),
        finish = $("finish");

  const PIECE_COLORS = ["var(--piece)","var(--piece2)","var(--piece3)","var(--piece4)","var(--piece5)"];

  function renderCurrent(){
    const w = state.order[state.idx];
    if (!w){ showFinish(); return; }
    pieceEl.textContent = w.piece;
    pieceEl.style.setProperty("--bgp", PIECE_COLORS[state.idx % PIECE_COLORS.length]);
    wordEl.innerHTML = "";
    const slot = document.createElement("span");
    slot.className = "slot";
    slot.id = "slot";
    slot.textContent = "▢▢";
    const fixed = document.createElement("span");
    fixed.textContent = w.piece;
    if (w.pos === "pre"){
      wordEl.append(slot, fixed);
    } else {
      wordEl.append(fixed, slot);
    }
    hintEl.textContent = "Какое сочетание подходит?";
    hintEl.className = "hint";
    chuBtn.classList.remove("disabled","flashOk","flashBad");
    shuBtn.classList.remove("disabled","flashOk","flashBad");
    progEl.textContent = `${state.idx + 1} / ${state.order.length}`;
    state.locked = false;
  }

  function fullWord(w){
    return w.pos === "pre"
      ? (w.pair === "chu" ? "ЧУ" : "ЩУ") + w.piece
      : w.piece + (w.pair === "chu" ? "ЧУ" : "ЩУ");
  }

  function speak(text){
    try{
      if (!("speechSynthesis" in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ru-RU";
      u.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function choose(which){
    if (state.locked) return;
    const w = state.order[state.idx];
    const correct = w.pair === which;
    state.locked = true;
    const btn = which === "chu" ? chuBtn : shuBtn;
    const other = which === "chu" ? shuBtn : chuBtn;

    if (correct){
      state.score += 1;
      scoreEl.textContent = state.score;
      btn.classList.add("flashOk");
      other.classList.add("disabled");
      const slot = document.getElementById("slot");
      slot.textContent = which === "chu" ? "ЧУ" : "ЩУ";
      slot.className = "fill " + (which === "shu" ? "shu" : "");
      hintEl.textContent = "Верно! " + fullWord(w);
      hintEl.className = "hint ok";
      state.collected.push({piece:w.piece, word:fullWord(w), pair:w.pair});
      renderCollected();
      speak(fullWord(w));
      setTimeout(() => {
        state.idx += 1;
        renderCurrent();
      }, 1100);
    } else {
      btn.classList.add("flashBad");
      hintEl.textContent = "Не то — попробуй другое сочетание.";
      hintEl.className = "hint bad";
      btn.classList.add("disabled");
      setTimeout(() => { state.locked = false; }, 350);
    }
  }

  function renderCollected(){
    listEl.innerHTML = "";
    state.collected.slice().reverse().forEach(c => {
      const li = document.createElement("li");
      const k = document.createElement("span"); k.className = "k"; k.textContent = c.piece;
      const v = document.createElement("span"); v.className = "v " + (c.pair === "shu" ? "shu" : "chu"); v.textContent = c.word;
      li.append(k, v);
      listEl.append(li);
    });
  }

  /* ------------------------------ Fireworks ------------------------------ */
  const fw = {
    canvas: null,
    ctx: null,
    parts: [],
    running: false,
    raf: 0,
    nextLaunch: 0,
    colors: ["#ffd43b","#06aed5","#ff6b6b","#a3f7bf","#fff09a","#ffffff","#ffafcc","#9b85ff"],
  };

  function sizeCanvas(){
    if (!fw.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fw.canvas.width  = fw.canvas.clientWidth  * dpr;
    fw.canvas.height = fw.canvas.clientHeight * dpr;
    fw.ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function explode(x, y, color){
    const count = 36 + Math.floor(Math.random()*24);
    const baseSpeed = 2 + Math.random()*1.6;
    for (let i = 0; i < count; i++){
      const a = (i / count) * Math.PI * 2 + Math.random()*0.1;
      const s = baseSpeed * (0.6 + Math.random()*0.8);
      fw.parts.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 1,
        decay: 0.012 + Math.random()*0.012,
        size: 1.5 + Math.random()*2,
        color,
      });
    }
  }

  function launchRandom(){
    const w = fw.canvas.clientWidth;
    const h = fw.canvas.clientHeight;
    const x = w * (0.1 + Math.random()*0.8);
    const y = h * (0.15 + Math.random()*0.4);
    const c = fw.colors[Math.floor(Math.random()*fw.colors.length)];
    explode(x, y, c);
  }

  function fwTick(){
    if (!fw.running) return;
    const ctx = fw.ctx;
    const w = fw.canvas.clientWidth;
    const h = fw.canvas.clientHeight;
    // fade trail
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(0,0,w,h);

    const now = performance.now();
    if (now >= fw.nextLaunch){
      launchRandom();
      // occasional double pop
      if (Math.random() < 0.35) setTimeout(launchRandom, 120);
      fw.nextLaunch = now + 350 + Math.random()*450;
    }

    const next = [];
    for (const p of fw.parts){
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + 0.04; // gravity
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life > 0 && p.y < h + 20){
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        next.push(p);
      }
    }
    ctx.globalAlpha = 1;
    fw.parts = next;
    fw.raf = requestAnimationFrame(fwTick);
  }

  function startFireworks(){
    fw.canvas = document.getElementById("fw");
    fw.ctx = fw.canvas.getContext("2d");
    sizeCanvas();
    fw.parts.length = 0;
    fw.running = true;
    fw.nextLaunch = performance.now();
    // immediate triple burst
    setTimeout(launchRandom, 0);
    setTimeout(launchRandom, 180);
    setTimeout(launchRandom, 360);
    fwTick();
  }

  function stopFireworks(){
    fw.running = false;
    if (fw.raf) cancelAnimationFrame(fw.raf);
    if (fw.ctx) fw.ctx.clearRect(0,0,fw.canvas.width,fw.canvas.height);
    fw.parts.length = 0;
  }

  window.addEventListener("resize", () => { if (fw.running) sizeCanvas(); });

  /* ------------------------------------------------------------------- */

  function showFinish(){
    const total = state.order.length;
    $("finishTitle").textContent = state.score === total ? "Отлично!" : "Молодец!";
    $("finishText").textContent = `Правильных слов: ${state.score} из ${total}.`;
    $("finishEmoji").textContent = state.score === total ? "🏆" : "🎆";
    finish.classList.add("show");
    // small delay so the overlay paints before sizing canvas
    requestAnimationFrame(startFireworks);
  }

  function reset(){
    stopFireworks();
    state.order = shuffle(WORDS);
    state.idx = 0;
    state.score = 0;
    state.collected = [];
    scoreEl.textContent = 0;
    listEl.innerHTML = "";
    finish.classList.remove("show");
    renderCurrent();
  }

  chuBtn.addEventListener("click", () => choose("chu"));
  shuBtn.addEventListener("click", () => choose("shu"));
  $("resetBtn").addEventListener("click", reset);
  $("againBtn").addEventListener("click", reset);
  $("speakBtn").addEventListener("click", () => {
    const w = state.order[state.idx];
    if (w) speak(w.piece);
  });

  document.addEventListener("keydown", e => {
    if (e.key === "1" || e.key.toLowerCase() === "ч") choose("chu");
    if (e.key === "2" || e.key.toLowerCase() === "щ") choose("shu");
  });

  renderCurrent();
</script>
</body>
</html>
