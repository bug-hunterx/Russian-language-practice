<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c0392b" />
<title>ЧА ЩА ЧУ ЩУ — игры</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%86%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg1:#ff4757;
    --bg2:#b51a2b;
    --ink:#ffffff;
    --muted:rgba(255,255,255,.78);
    --chu:#ffd43b;
    --shu:#06aed5;
    --piece:#fde6f1;
    --piece2:#e3ddff;
    --piece3:#d9f1ff;
    --piece4:#fff0c2;
    --piece5:#d6f5dc;
    --shadow:0 4px 0 rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    overscroll-behavior:none;user-select:none}
  body{min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(1200px 600px at 20% -10%, #ff7a85 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #7a0e1c 0%, transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
  }

  header{padding:14px 16px 6px;text-align:center;position:relative}
  .title{font-size:21px;font-weight:800;letter-spacing:.5px;margin:0;
    text-shadow:0 2px 0 rgba(0,0,0,.18)}
  .title .c{color:var(--chu)}
  .title .s{color:var(--shu)}
  .rule{font-size:13px;color:var(--muted);margin:4px 14px 0}

  .backBtn{position:absolute;top:14px;left:12px;width:38px;height:38px;
    border-radius:50%;border:0;background:rgba(255,255,255,.96);color:#2a2350;
    font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);cursor:pointer;line-height:1}
  .backBtn[hidden]{display:none}

  main{flex:1;display:flex;flex-direction:column;padding:8px 14px 18px;gap:10px}

  .screen[hidden]{display:none}

  /* ---------------- MENU ---------------- */
  .menu{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0}
  .menuCards{display:grid;gap:14px;width:100%;max-width:420px}
  .menuCard{
    appearance:none;border:0;cursor:pointer;
    background:rgba(255,255,255,.97);color:#2a2350;
    border-radius:20px;padding:18px;text-align:left;
    display:flex;align-items:center;gap:14px;
    box-shadow:var(--shadow);
    transition:transform .08s ease;
  }
  .menuCard:active{transform:translateY(2px) scale(.99)}
  .menuCard .emoji{font-size:40px;line-height:1;flex-shrink:0}
  .menuCard .t{font-size:16px;font-weight:800;line-height:1.2}
  .menuCard .d{font-size:13px;color:#6b6792;margin-top:4px;line-height:1.3}

  .scoreRow{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
  .score,.progress{font-size:13px;color:var(--muted);font-weight:600}
  .score b{color:#fff;font-size:16px}

  /* ---------------- GAME 1 (pair matching) ---------------- */
  .g1Stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 8px 4px}
  .word{font-size:30px;font-weight:800;letter-spacing:2px;min-height:42px;
    display:flex;align-items:center;justify-content:center;gap:2px;
    color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .word .slot{opacity:.55;border-bottom:3px dashed rgba(255,255,255,.7);padding:0 6px;min-width:48px;text-align:center}
  .word .fill{color:var(--chu);animation:pop .35s ease}
  .word .fill.shu{color:var(--shu)}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

  .hint{font-size:14px;color:var(--muted);min-height:18px;text-align:center;transition:color .2s}
  .hint.ok{color:#fffbcf;font-weight:700}
  .hint.bad{color:#ffe5a8;font-weight:700}

  .piece{
    --bgp:var(--piece);
    background:var(--bgp);color:#2a2350;
    font-weight:800;font-size:30px;letter-spacing:1.5px;
    padding:18px 24px;border-radius:18px;
    box-shadow:var(--shadow);position:relative;min-width:120px;text-align:center;
  }
  .piece::before,.piece::after{content:"";position:absolute;width:22px;height:22px;background:var(--bgp);
    border-radius:50%;top:50%;transform:translateY(-50%)}
  .piece::before{left:-11px} .piece::after{right:-11px}

  .choices{display:flex;gap:18px;justify-content:center;align-items:center;padding:6px 4px 14px;flex-wrap:wrap}
  .btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:900;
    font-size:34px;letter-spacing:2px;padding:18px 28px;border-radius:22px;color:#2a2350;
    box-shadow:var(--shadow);transition:transform .08s ease, filter .15s ease;min-width:130px}
  .btn:active{transform:translateY(2px) scale(.98)}
  .btn.chu{background:linear-gradient(180deg,#fff09a,#ffc83b);color:#3a2a00}
  .btn.shu{background:linear-gradient(180deg,#7be3ff,#06aed5);color:#04263a}
  .btn.disabled{filter:grayscale(.4) opacity(.55);pointer-events:none}
  .btn.flashOk{animation:flashOk .5s ease}
  .btn.flashBad{animation:shake .4s ease}
  @keyframes flashOk{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .collected{background:rgba(255,255,255,.96);color:#2a2350;border-radius:18px;padding:10px 12px;
    box-shadow:0 2px 0 rgba(0,0,0,.1), 0 6px 18px rgba(0,0,0,.18);max-height:34vh;overflow-y:auto}
  .collected h3{margin:0 0 8px;font-size:13px;color:#6b6792;text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .collected ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
  .collected li{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:6px}
  .collected li .k{font-size:11px;color:#6b6792;font-weight:600;min-width:54px}
  .collected li .v.chu{color:#c9931d} .collected li .v.shu{color:#0683a0}
  .collected:empty{display:none}

  .toolbar{display:flex;gap:10px;justify-content:center;padding:4px 0 6px;flex-wrap:wrap}
  .tool{appearance:none;border:0;background:rgba(255,255,255,.96);color:#2a2350;
    font:inherit;font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;
    box-shadow:var(--shadow);cursor:pointer}
  .tool:active{transform:translateY(1px)}
  .tool .ic{margin-right:6px}

  /* ---------------- GAME 2 (word search / филворд) ---------------- */
  .g2Wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 0 6px}
  .g2Grid{display:grid;grid-template-columns:repeat(var(--cols), 1fr);gap:2px;
    background:rgba(255,255,255,.97);padding:6px;border-radius:12px;
    width:100%;max-width:440px;box-shadow:var(--shadow)}
  .g2Grid .cell{
    appearance:none;border:0;font:inherit;font-weight:700;
    font-size:clamp(10px, 3.2vw, 18px);
    color:#2a2350;background:#fff5e6;
    border-radius:4px;cursor:pointer;padding:0;
    aspect-ratio:1 / 1;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s, transform .08s;
  }
  .g2Grid .cell:active{transform:scale(.94)}
  .g2Grid .cell.start{background:#06aed5;color:#fff}
  .g2Grid .cell.found{background:#aaf683;color:#214d12}
  .g2Grid .cell.miss{background:#ffb1b1;animation:shake .35s ease}

  .g2Words{
    list-style:none;margin:0;padding:10px 12px;
    background:rgba(255,255,255,.97);color:#2a2350;
    border-radius:14px;
    display:grid;grid-template-columns:repeat(auto-fill, minmax(108px, 1fr));
    gap:4px 10px;font-size:13px;width:100%;max-width:440px;
    box-shadow:var(--shadow);
  }
  .g2Words .w{font-weight:700;padding:2px 0}
  .g2Words .w.done{text-decoration:line-through;opacity:.45;color:#1c7a32}

  /* ---------------- Finish & Fireworks ---------------- */
  .finish{position:fixed;inset:0;background:rgba(40,0,5,.62);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
  .finish.show{display:flex}
  .finish #fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .finish .card{position:relative;z-index:1;background:#fff;color:#2a2350;
    border-radius:22px;padding:22px;text-align:center;max-width:340px;width:100%;box-shadow:var(--shadow)}
  .finish h2{margin:0 0 6px;font-size:22px}
  .finish p{margin:6px 0 14px;color:#6b6792}
  .finish .big{font-size:46px;margin:8px 0}
  .finish .again{background:linear-gradient(180deg,#ffd86b,#ffae3b);color:#3a2a00;
    border:0;font-weight:900;font-size:16px;padding:14px 24px;border-radius:14px;
    box-shadow:var(--shadow);cursor:pointer}

  @media (min-width:520px){
    .word{font-size:38px}
    .piece{font-size:36px;padding:22px 32px}
    .btn{font-size:42px;padding:22px 36px}
    .g2Grid .cell{font-size:18px}
  }
</style>
</head>
<body>
  <header>
    <button class="backBtn" id="backBtn" hidden aria-label="Назад">←</button>
    <h1 class="title" id="title">Игры для тренировки</h1>
    <p class="rule" id="rule">Выбери игру и тренируйся!</p>
  </header>

  <main>
    <!-- MENU -->
    <section class="screen menu" id="screenMenu">
      <div class="menuCards">
        <button class="menuCard" data-go="game1">
          <div class="emoji">🧩</div>
          <div>
            <div class="t">Собери слова с <span style="color:#c9931d">ЧУ</span> и <span style="color:#0683a0">ЩУ</span></div>
            <div class="d">Соедини половинки слов</div>
          </div>
        </button>
        <button class="menuCard" data-go="game2">
          <div class="emoji">🔎</div>
          <div>
            <div class="t">Филворд — Я ищу</div>
            <div class="d">Найди слова с ЧА, ЩА, ЧУ и ЩУ</div>
          </div>
        </button>
      </div>
    </section>

    <!-- GAME 1: pair matching -->
    <section class="screen" id="screenGame1" hidden>
      <div class="scoreRow">
        <div class="score">Очки: <b id="score1">0</b></div>
        <div class="progress" id="prog1">1 / 18</div>
      </div>
      <div class="g1Stage">
        <div class="word" id="word" aria-live="polite"></div>
        <div class="piece" id="piece">—</div>
        <div class="hint" id="hint">Какое сочетание подходит?</div>
        <div class="choices">
          <button class="btn chu" id="chuBtn" aria-label="ЧУ">ЧУ</button>
          <button class="btn shu" id="shuBtn" aria-label="ЩУ">ЩУ</button>
        </div>
      </div>
      <div class="toolbar">
        <button class="tool" id="speakBtn"><span class="ic">🔊</span>Сказать</button>
        <button class="tool" id="reset1Btn"><span class="ic">↺</span>Заново</button>
      </div>
      <section class="collected" id="collected">
        <h3>Собранные слова</h3>
        <ul id="collectedList"></ul>
      </section>
    </section>

    <!-- GAME 2: word search -->
    <section class="screen" id="screenGame2" hidden>
      <div class="scoreRow">
        <div class="score">Найдено: <b id="g2Progress">0 / 19</b></div>
        <div class="progress" id="g2Hint">Нажми на первую и последнюю букву</div>
      </div>
      <div class="g2Wrap">
        <div class="g2Grid" id="g2Grid" style="--cols:14;--rows:15"></div>
        <ul class="g2Words" id="g2Words"></ul>
        <div class="toolbar">
          <button class="tool" id="reset2Btn"><span class="ic">↺</span>Новый филворд</button>
        </div>
      </div>
    </section>
  </main>

  <div class="finish" id="finish" role="dialog" aria-modal="true">
    <canvas id="fw" aria-hidden="true"></canvas>
    <div class="card">
      <div class="big" id="finishEmoji">🎆</div>
      <h2 id="finishTitle">Молодец!</h2>
      <p id="finishText">Ты собрал все слова.</p>
      <button class="again" id="againBtn">Сыграть ещё</button>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);

  /* ====================== Router ====================== */
  const HEADERS = {
    menu:  {t:"Игры для тренировки", r:"Выбери игру и тренируйся!"},
    game1: {t:"<span style='color:#ffd43b'>ЧУ</span> и <span style='color:#06aed5'>ЩУ</span> — собери слова",
            r:"ЧУ и ЩУ всегда пишутся с буквой У. Соедини половинки!"},
    game2: {t:"Филворд: ЧА, ЩА, ЧУ, ЩУ",
            r:"Найди все слова. Они идут по горизонтали и вертикали, могут быть справа налево."},
  };

  function setScreen(name){
    document.querySelectorAll(".screen").forEach(s => s.hidden = true);
    $("screen" + name[0].toUpperCase() + name.slice(1)).hidden = false;
    $("title").innerHTML = HEADERS[name].t;
    $("rule").textContent = HEADERS[name].r;
    $("backBtn").hidden = (name === "menu");
    stopFireworks();
    $("finish").classList.remove("show");
    if (name === "game1") Game1.start();
    if (name === "game2") Game2.start();
  }

  function route(){
    const h = (location.hash.replace("#","") || "menu");
    setScreen(["menu","game1","game2"].includes(h) ? h : "menu");
  }

  window.addEventListener("hashchange", route);
  document.addEventListener("click", e => {
    const card = e.target.closest("[data-go]");
    if (card){ location.hash = "#" + card.dataset.go; }
  });
  $("backBtn").addEventListener("click", () => { location.hash = "#menu"; });

  /* ====================== Speak ====================== */
  function speak(text){
    try{
      if (!("speechSynthesis" in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ru-RU"; u.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ====================== Fireworks ====================== */
  const fw = {canvas:null, ctx:null, parts:[], running:false, raf:0, nextLaunch:0,
    colors:["#ffd43b","#06aed5","#ff6b6b","#a3f7bf","#fff09a","#ffffff","#ffafcc","#9b85ff"]};
  function sizeCanvas(){
    if (!fw.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fw.canvas.width  = fw.canvas.clientWidth  * dpr;
    fw.canvas.height = fw.canvas.clientHeight * dpr;
    fw.ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function explode(x, y, color){
    const count = 36 + Math.floor(Math.random()*24);
    const baseSpeed = 2 + Math.random()*1.6;
    for (let i = 0; i < count; i++){
      const a = (i / count) * Math.PI * 2 + Math.random()*0.1;
      const s = baseSpeed * (0.6 + Math.random()*0.8);
      fw.parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1,
        decay:0.012 + Math.random()*0.012, size:1.5 + Math.random()*2, color});
    }
  }
  function launchRandom(){
    const w = fw.canvas.clientWidth, h = fw.canvas.clientHeight;
    const x = w*(0.1 + Math.random()*0.8);
    const y = h*(0.15 + Math.random()*0.4);
    explode(x, y, fw.colors[Math.floor(Math.random()*fw.colors.length)]);
  }
  function fwTick(){
    if (!fw.running) return;
    const ctx = fw.ctx, w = fw.canvas.clientWidth, h = fw.canvas.clientHeight;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(0,0,w,h);
    const now = performance.now();
    if (now >= fw.nextLaunch){
      launchRandom();
      if (Math.random() < 0.35) setTimeout(launchRandom, 120);
      fw.nextLaunch = now + 350 + Math.random()*450;
    }
    const next = [];
    for (const p of fw.parts){
      p.vx *= 0.985;
      p.vy = p.vy*0.985 + 0.04;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      if (p.life > 0 && p.y < h + 20){
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        next.push(p);
      }
    }
    ctx.globalAlpha = 1;
    fw.parts = next;
    fw.raf = requestAnimationFrame(fwTick);
  }
  function startFireworks(){
    fw.canvas = $("fw");
    fw.ctx = fw.canvas.getContext("2d");
    sizeCanvas();
    fw.parts.length = 0;
    fw.running = true;
    fw.nextLaunch = performance.now();
    setTimeout(launchRandom, 0);
    setTimeout(launchRandom, 180);
    setTimeout(launchRandom, 360);
    fwTick();
  }
  function stopFireworks(){
    fw.running = false;
    if (fw.raf) cancelAnimationFrame(fw.raf);
    if (fw.ctx && fw.canvas) fw.ctx.clearRect(0,0,fw.canvas.width,fw.canvas.height);
    fw.parts.length = 0;
  }
  window.addEventListener("resize", () => { if (fw.running) sizeCanvas(); });

  function showFinish(title, text, emoji, onAgain){
    $("finishTitle").textContent = title;
    $("finishText").textContent = text;
    $("finishEmoji").textContent = emoji;
    $("finish").classList.add("show");
    $("againBtn").onclick = onAgain;
    requestAnimationFrame(startFireworks);
  }

  /* ====================== GAME 1: pair matching ====================== */
  const Game1 = (() => {
    const WORDS = [
      {piece:"ДЕСА",  pair:"chu", pos:"pre"},   // ЧУДЕСА
      {piece:"ЛОК",   pair:"chu", pos:"pre"},   // ЧУЛОК
      {piece:"ЖОЙ",   pair:"chu", pos:"pre"},   // ЧУЖОЙ
      {piece:"ТКИЙ",  pair:"chu", pos:"pre"},   // ЧУТКИЙ
      {piece:"ХО",    pair:"chu", pos:"post"},  // ХОЧУ
      {piece:"КРИ",   pair:"chu", pos:"post"},  // КРИЧУ
      {piece:"СКА",   pair:"chu", pos:"post"},  // СКАЧУ
      {piece:"ПЛА",   pair:"chu", pos:"post"},  // ПЛАЧУ
      {piece:"СТУ",   pair:"chu", pos:"post"},  // СТУЧУ
      {piece:"ЛЕ",    pair:"chu", pos:"post"},  // ЛЕЧУ
      {piece:"РИТЬ",  pair:"shu", pos:"pre"},   // ЩУРИТЬ
      {piece:"ПЛЫЙ",  pair:"shu", pos:"pre"},   // ЩУПЛЫЙ
      {piece:"И",     pair:"shu", pos:"post"},  // ИЩУ
      {piece:"ПИ",    pair:"shu", pos:"post"},  // ПИЩУ
      {piece:"ТРЕ",   pair:"shu", pos:"post"},  // ТРЕЩУ
      {piece:"ТА",    pair:"shu", pos:"post"},  // ТАЩУ
      {piece:"ПЛЕ",   pair:"shu", pos:"post"},  // ПЛЕЩУ
      {piece:"ПРО",   pair:"shu", pos:"post"},  // ПРОЩУ
    ];
    const PIECE_COLORS = ["var(--piece)","var(--piece2)","var(--piece3)","var(--piece4)","var(--piece5)"];
    const shuffle = a => { const x=a.slice(); for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];} return x; };
    const state = {order:[], idx:0, score:0, collected:[], locked:false};
    const wordEl = $("word"), pieceEl = $("piece"), hintEl = $("hint"),
          chuBtn = $("chuBtn"), shuBtn = $("shuBtn"),
          scoreEl = $("score1"), progEl = $("prog1"),
          listEl = $("collectedList");

    function render(){
      const w = state.order[state.idx];
      if (!w){ done(); return; }
      pieceEl.textContent = w.piece;
      pieceEl.style.setProperty("--bgp", PIECE_COLORS[state.idx % PIECE_COLORS.length]);
      wordEl.innerHTML = "";
      const slot = document.createElement("span");
      slot.className = "slot"; slot.id = "slot"; slot.textContent = "▢▢";
      const fixed = document.createElement("span"); fixed.textContent = w.piece;
      if (w.pos === "pre") wordEl.append(slot, fixed); else wordEl.append(fixed, slot);
      hintEl.textContent = "Какое сочетание подходит?";
      hintEl.className = "hint";
      chuBtn.classList.remove("disabled","flashOk","flashBad");
      shuBtn.classList.remove("disabled","flashOk","flashBad");
      progEl.textContent = `${state.idx + 1} / ${state.order.length}`;
      state.locked = false;
    }
    function fullWord(w){
      return w.pos === "pre" ? (w.pair === "chu" ? "ЧУ" : "ЩУ") + w.piece
                             : w.piece + (w.pair === "chu" ? "ЧУ" : "ЩУ");
    }
    function choose(which){
      if (state.locked) return;
      const w = state.order[state.idx];
      const correct = w.pair === which;
      state.locked = true;
      const btn = which === "chu" ? chuBtn : shuBtn;
      const other = which === "chu" ? shuBtn : chuBtn;
      if (correct){
        state.score += 1;
        scoreEl.textContent = state.score;
        btn.classList.add("flashOk");
        other.classList.add("disabled");
        const slot = $("slot");
        slot.textContent = which === "chu" ? "ЧУ" : "ЩУ";
        slot.className = "fill " + (which === "shu" ? "shu" : "");
        hintEl.textContent = "Верно! " + fullWord(w);
        hintEl.className = "hint ok";
        state.collected.push({piece:w.piece, word:fullWord(w), pair:w.pair});
        renderCollected();
        speak(fullWord(w));
        setTimeout(() => { state.idx += 1; render(); }, 1100);
      } else {
        btn.classList.add("flashBad","disabled");
        hintEl.textContent = "Не то — попробуй другое сочетание.";
        hintEl.className = "hint bad";
        setTimeout(() => { state.locked = false; }, 350);
      }
    }
    function renderCollected(){
      listEl.innerHTML = "";
      state.collected.slice().reverse().forEach(c => {
        const li = document.createElement("li");
        const k = document.createElement("span"); k.className = "k"; k.textContent = c.piece;
        const v = document.createElement("span"); v.className = "v " + (c.pair === "shu" ? "shu" : "chu"); v.textContent = c.word;
        li.append(k, v); listEl.append(li);
      });
    }
    function done(){
      const total = state.order.length;
      const perfect = state.score === total;
      showFinish(perfect ? "Отлично!" : "Молодец!",
                 `Правильных слов: ${state.score} из ${total}.`,
                 perfect ? "🏆" : "🎆",
                 () => { stopFireworks(); $("finish").classList.remove("show"); start(); });
    }
    function start(){
      state.order = shuffle(WORDS);
      state.idx = 0; state.score = 0; state.collected = []; state.locked = false;
      scoreEl.textContent = 0;
      listEl.innerHTML = "";
      render();
    }
    chuBtn.addEventListener("click", () => choose("chu"));
    shuBtn.addEventListener("click", () => choose("shu"));
    $("reset1Btn").addEventListener("click", start);
    $("speakBtn").addEventListener("click", () => {
      const w = state.order[state.idx];
      if (w) speak(w.piece);
    });
    document.addEventListener("keydown", e => {
      if ($("screenGame1").hidden) return;
      if (e.key === "1" || e.key.toLowerCase() === "ч") choose("chu");
      if (e.key === "2" || e.key.toLowerCase() === "щ") choose("shu");
    });
    return {start};
  })();

  /* ====================== GAME 2: word search (филворд) ====================== */
  const Game2 = (() => {
    const WORDS = ["ЧАЙНИК","ВОРЧУН","КОЩУНСТВО","ПОЩАДА","ЧАСОВОЙ","ЧУДАК","ЧУТКИЙ",
                   "ГАЛЧАТА","ОБЕЩАТЬ","ПРОЩАТЬ","ВКУСНОТИЩА","ЖЕМЧУГ","КЕТЧУП","МОЛЧУН",
                   "ГУЩА","ПОДАЧА","ПРИЩУР","ЧУШЬ","ЧУТЬЁ"];
    const SET = new Set(WORDS);
    const ROWS = 15, COLS = 14;
    const DIRS = [{dr:0,dc:1},{dr:0,dc:-1},{dr:1,dc:0}];
    const ALPHA = "АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯЁ";
    const gridEl = $("g2Grid"), wordsEl = $("g2Words"), progEl = $("g2Progress"), hintEl = $("g2Hint");
    let grid = null, found = null, sel = null;

    function tryBuild(){
      const g = Array.from({length: ROWS}, () => Array(COLS).fill(null));
      const ws = WORDS.slice().sort((a,b) => b.length - a.length);
      for (const word of ws){
        let ok = false;
        for (let t = 0; t < 250 && !ok; t++){
          const d = DIRS[Math.floor(Math.random()*DIRS.length)];
          const r0 = Math.floor(Math.random()*ROWS);
          const c0 = Math.floor(Math.random()*COLS);
          const r1 = r0 + d.dr*(word.length-1);
          const c1 = c0 + d.dc*(word.length-1);
          if (r1 < 0 || r1 >= ROWS || c1 < 0 || c1 >= COLS) continue;
          let fits = true;
          for (let i = 0; i < word.length; i++){
            const r = r0 + d.dr*i, c = c0 + d.dc*i;
            if (g[r][c] !== null && g[r][c] !== word[i]) { fits = false; break; }
          }
          if (!fits) continue;
          for (let i = 0; i < word.length; i++){
            g[r0 + d.dr*i][c0 + d.dc*i] = word[i];
          }
          ok = true;
        }
        if (!ok) return null;
      }
      for (let r = 0; r < ROWS; r++){
        for (let c = 0; c < COLS; c++){
          if (g[r][c] === null) g[r][c] = ALPHA[Math.floor(Math.random()*ALPHA.length)];
        }
      }
      return g;
    }

    function build(){
      for (let i = 0; i < 50; i++){
        const g = tryBuild();
        if (g) return g;
      }
      return tryBuild();
    }

    function cellEl(r, c){
      return gridEl.children[r * COLS + c];
    }

    function tap(r, c){
      const el = cellEl(r, c);
      if (el.classList.contains("found")) {
        // Tapping on found cells just clears any pending selection
        clearSelection();
        return;
      }
      if (!sel){
        sel = {r, c};
        el.classList.add("start");
        return;
      }
      if (sel.r === r && sel.c === c){
        clearSelection();
        return;
      }
      if (sel.r !== r && sel.c !== c){
        clearSelection();
        sel = {r, c};
        el.classList.add("start");
        return;
      }
      const dr = Math.sign(r - sel.r), dc = Math.sign(c - sel.c);
      const len = Math.max(Math.abs(r - sel.r), Math.abs(c - sel.c)) + 1;
      let str = "";
      const cells = [];
      for (let i = 0; i < len; i++){
        const rr = sel.r + dr*i, cc = sel.c + dc*i;
        str += grid[rr][cc];
        cells.push({r:rr, c:cc});
      }
      const rev = str.split("").reverse().join("");
      let match = null;
      if (SET.has(str) && !found.has(str)) match = str;
      else if (SET.has(rev) && !found.has(rev)) match = rev;

      cellEl(sel.r, sel.c).classList.remove("start");
      sel = null;

      if (match){
        found.add(match);
        for (const {r, c} of cells) cellEl(r, c).classList.add("found");
        renderWords();
        renderProgress();
        speak(match);
        if (found.size === WORDS.length){
          setTimeout(() => {
            showFinish("Все найдены!",
                       `Найдено слов: ${found.size} из ${WORDS.length}.`,
                       "🏆",
                       () => { stopFireworks(); $("finish").classList.remove("show"); start(); });
          }, 450);
        }
      } else {
        for (const {r, c} of cells) cellEl(r, c).classList.add("miss");
        setTimeout(() => {
          for (const {r, c} of cells) cellEl(r, c).classList.remove("miss");
        }, 400);
      }
    }

    function clearSelection(){
      if (sel){ cellEl(sel.r, sel.c).classList.remove("start"); sel = null; }
    }

    function renderGrid(){
      gridEl.style.setProperty("--cols", COLS);
      gridEl.style.setProperty("--rows", ROWS);
      gridEl.innerHTML = "";
      for (let r = 0; r < ROWS; r++){
        for (let c = 0; c < COLS; c++){
          const b = document.createElement("button");
          b.className = "cell";
          b.textContent = grid[r][c];
          b.addEventListener("click", () => tap(r, c));
          gridEl.append(b);
        }
      }
    }

    function renderWords(){
      wordsEl.innerHTML = "";
      for (const w of WORDS){
        const li = document.createElement("li");
        li.className = "w" + (found.has(w) ? " done" : "");
        li.textContent = w;
        wordsEl.append(li);
      }
    }

    function renderProgress(){
      progEl.textContent = `${found.size} / ${WORDS.length}`;
    }

    function start(){
      grid = build();
      found = new Set();
      sel = null;
      renderGrid();
      renderWords();
      renderProgress();
    }

    $("reset2Btn").addEventListener("click", start);
    return {start};
  })();

  /* ====================== Boot ====================== */
  route();
</script>
</body>
</html>
